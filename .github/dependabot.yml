version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /.github/scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
