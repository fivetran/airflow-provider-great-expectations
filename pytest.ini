[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unit: marks unit tests that run without external services
    integration: marks integration tests that run real GX validations without external services
    postgres: marks tests as requiring a running Postgres instance
    spark_integration: marks tests as Spark integration tests requiring a local Spark instance
    spark_connect_integration: marks tests as Spark Connect integration tests requiring Spark Connect server
