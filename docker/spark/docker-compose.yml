services:
  spark-connect:
    # The default is the Spark image pinned in .github/support-matrix.toml; override it with SPARK_IMAGE.
    # Keep the server version equal to the installed pyspark client version.
    image: ${SPARK_IMAGE:-apache/spark:4.1.3-java17@sha256:9b0a6c2c860f5e7d18dd5270286fef32a09c7f5a7e2b0dbe5642de8a3a02ab3e}
    container_name: spark-connect
    ports:
      - "15002:15002"                     # Spark Connect gRPC
    # The Connect server ships in the Spark distribution, so nothing is downloaded at start.
    # --wait keeps the server in the foreground, which is what keeps the container running.
    command: ["/opt/spark/sbin/start-connect-server.sh", "--wait"]
    healthcheck:
      # Healthy once the gRPC port accepts connections.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/15002"]
      interval: 5s
      timeout: 3s
      retries: 20
