[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-great-expectations"
dynamic = ["version"]
description = "An Apache Airflow provider for Great Expectations"
readme = "README.md"
authors = [
  {name = "Great Expectations", email = "team@greatexpectations.io"}
]
license = "Apache-2.0"
license-files = { paths = ["LICENSE"] }
requires-python = ">=3.11"
keywords = ["airflow", "great expectations", "provider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "great-expectations>=1.23.2,<2",
    "great-expectations>=1.24.0,<2; python_version>='3.14'",
    "apache-airflow>=2.11.0,<4",
]

[project.optional-dependencies]
athena = ["great-expectations[athena]>=1.23.2,<2"]
azure = ["great-expectations[azure]>=1.23.2,<2"]
bigquery = ["great-expectations[bigquery]>=1.23.2,<2"]
lint = [
    "mypy==1.14.1",
    "ruff==0.8.3",
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "great-expectations[spark, spark-connect]>=1.23.2,<2"
]
gcp = ["great-expectations[gcp]>=1.23.2,<2"]
mssql = ["great-expectations[sql-server]>=1.23.2,<2"]
postgresql = ["great-expectations[postgresql]>=1.23.2,<2"]
s3 = ["great-expectations[s3]>=1.23.2,<2"]
snowflake = ["great-expectations[snowflake]>=1.23.2,<2"]
spark = [
    "great-expectations[spark, spark-connect]>=1.23.2,<2",
    "pyarrow>=4.0.0",
    "setuptools",  # pyspark needs distutils, removed in Python 3.12
]
sql-server = ["great-expectations[sql-server]>=1.23.2,<2"]
trino = ["great-expectations[trino]>=1.23.2,<2"]
tests = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0"
]

[project.entry-points.apache_airflow_provider]
provider_info = "great_expectations_provider.get_provider_info:get_provider_info"

[project.urls]
Homepage = "https://github.com/great-expectations/airflow-provider-great-expectations"
Documentation = "https://great-expectations.github.io/airflow-provider-great-expectations/latest"
"Source Code" = "https://github.com/great-expectations/airflow-provider-great-expectations"
"Changelog" = "https://github.com/great-expectations/airflow-provider-great-expectations/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "great_expectations_provider/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/great_expectations_provider"]

[tool.hatch.build.targets.wheel]
packages = ["/great_expectations_provider"]

# The Airflow tier flags (AIRFLOW_V_3_0_PLUS, AIRFLOW_V_3_1_PLUS) are passed to mypy on the
# command line, once per tier, with --always-true/--always-false. Do not set always_true or
# always_false here: mypy adds command-line values to these lists and exits with an error when
# a name ends up both always true and always false.
[tool.mypy]
exclude = ["env/", ".env/","venv/", ".venv/", "build/"]
follow_untyped_imports = true
check_untyped_defs = true

[tool.ruff]
lint.select = [
    "I",
    "TC",
]

[tool.distutils.bdist_wheel]
universal = true

######################################
# DOCS
######################################

[tool.hatch.envs.docs]
dependencies = [
    "mkdocs",
    "mike",
    "pymdown-extensions",
    "mkdocs-material",
]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build"  # Build docs without serving (used in CI)
dev = "mkdocs build && mkdocs serve"  # For local development
gh-deploy = "python scripts/docs_deploy.py dev"
gh-release = "python scripts/docs_deploy.py release"
